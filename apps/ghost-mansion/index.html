<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Mansion</title>
    <style>
      :root {
        --bg: #1b1426;
        --panel: #251b36;
        --panel-2: #2e2440;
        --line: #4a3b63;
        --text: #f3e9ff;
        --muted: #c9bddb;
        --accent: #ff7a1a;
        --bell: #4fc3f7;
        --damage: #e03030;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: 12px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.45;
      }
      a { color: var(--bell); }
      h1 { margin: 0 0 8px; font-size: 1.5rem; color: var(--accent); }
      #app { grid-area: head; }
      #view {
        grid-area: view;
        width: 100%;
        height: 60vh;
        min-height: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      #panel {
        grid-area: panel;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin-top: 12px;
      }
      @media (min-width: 900px) {
        body {
          display: grid;
          grid-template-columns: 65fr 35fr;
          grid-template-areas: "head head" "view panel";
          grid-template-rows: auto auto;
          column-gap: 16px;
          align-items: start;
        }
        #view { height: 80vh; }
        #panel { margin-top: 0; max-height: 80vh; overflow-y: auto; }
      }

      #panel h2 { margin: 8px 0 4px; font-size: 1.4rem; color: var(--accent); }
      #panel h3 { margin: 12px 0 4px; font-size: 1.05rem; }
      #panel p { margin: 6px 0; }
      #panel ul { margin: 6px 0; padding-left: 20px; }
      .gm-instruction { font-size: 1.05rem; background: var(--panel-2); border-left: 4px solid var(--accent); padding: 8px 10px; border-radius: 4px; }

      .gm-steps { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 0; padding: 0; counter-reset: step; }
      .gm-steps li {
        counter-increment: step;
        font-size: 0.78rem;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .gm-steps li::before { content: counter(step) ". "; }
      .gm-steps li.gm-step-current { background: var(--accent); border-color: var(--accent); color: #1b1426; font-weight: 700; }

      .gm-notice { border: 2px solid var(--damage); background: rgba(224, 48, 48, 0.15); border-radius: 6px; padding: 8px 10px; font-weight: 600; }
      .gm-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px 8px; margin: 8px 0; }
      .gm-stars { font-size: 2.4rem; letter-spacing: 4px; color: var(--accent); margin: 4px 0; }
      .gm-chart { max-width: 100%; height: auto; color: var(--text); }

      button {
        font: inherit;
        color: var(--text);
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        padding: 6px 12px;
      }
      button:hover:not(:disabled) { border-color: var(--text); }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--bell); outline-offset: 2px; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }

      .gm-views { display: flex; margin: 12px 0 8px; }
      .gm-view-btn { flex: 1; border-radius: 0; margin-left: -1px; font-size: 0.9rem; }
      .gm-view-btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
      .gm-view-btn:last-child { border-radius: 0 6px 6px 0; }
      .gm-view-btn.gm-active { background: var(--bell); border-color: var(--bell); color: #10202a; font-weight: 700; position: relative; }

      .gm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .gm-secondary { background: transparent; border-color: var(--muted); }
      .gm-primary {
        width: 100%;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 12px 16px;
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1426;
      }
      .gm-primary:hover:not(:disabled) { background: #ff9440; border-color: #ff9440; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="view"></div>
    <div id="panel"></div>
    <script type="module" src="/apps/ghost-mansion/main.ts"></script>
  </body>
</html>
