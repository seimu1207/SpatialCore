<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Mansion</title>
    <style>
      :root {
        --bg: #1b1426;
        --panel: #251b36;
        --panel-2: #2e2440;
        --line: #4a3b63;
        --text: #f3e9ff;
        --muted: #d3c8e3;
        --accent: #ff7a1a;
        --accent-2: #ff9440;
        --purple: #6a3fb5;
        --bell: #4fc3f7;
        --damage: #ff6b6b;
        --serif: Georgia, "Hiragino Mincho ProN", "Yu Mincho", "Times New Roman", serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { background: var(--bg); }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 14px 18px 24px;
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.5;
        background:
          radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%),
          radial-gradient(circle at 80% 10%, rgba(106, 63, 181, 0.55), transparent 55%),
          linear-gradient(160deg, #3a2266 0%, #1f1433 45%, #0d0814 100%);
        background-color: #1b1426;
        background-attachment: fixed;
      }
      a { color: var(--bell); }
      h1, h2, h3 { font-family: var(--serif); font-weight: 700; }
      #app { grid-area: head; }
      #view {
        grid-area: view;
        width: 100%;
        height: 60vh;
        min-height: 360px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(106, 63, 181, 0.5), 0 0 40px rgba(130, 80, 220, 0.35);
      }
      #panel {
        grid-area: panel;
        background: #251b36;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 16px 18px 18px;
        margin-top: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        #panel {
          background: rgba(37, 27, 54, 0.72);
          -webkit-backdrop-filter: blur(16px) saturate(140%);
          backdrop-filter: blur(16px) saturate(140%);
        }
      }
      @media (min-width: 900px) {
        body {
          display: grid;
          grid-template-columns: 65fr 35fr;
          grid-template-areas: "head head" "view panel";
          grid-template-rows: auto auto;
          column-gap: 18px;
          align-items: start;
        }
        #view { height: 84vh; }
        #panel { margin-top: 0; max-height: 84vh; overflow-y: auto; }
      }

      #panel h2 { margin: 14px 0 4px; font-size: 1.7rem; color: var(--accent); }
      #panel h3 { margin: 12px 0 4px; font-size: 1.1rem; }
      #panel p { margin: 6px 0; }
      #panel ul { margin: 6px 0; padding-left: 20px; }

      .gm-guide { display: flex; align-items: flex-start; gap: 12px; }
      .gm-ghost { flex: none; filter: drop-shadow(0 0 8px rgba(255, 122, 26, 0.55)); animation: gm-float 3.2s ease-in-out infinite; }
      .gm-bubble {
        position: relative;
        margin: 4px 0 0 !important;
        padding: 10px 14px;
        font-size: 1.05rem;
        color: #1b1426;
        background: #f6efff;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .gm-bubble::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 16px;
        border: 8px solid transparent;
        border-left: 0;
        border-right-color: #f6efff;
      }

      .gm-progress { margin: 12px 0 0; }
      .gm-progress-bar { display: flex; gap: 6px; }
      .gm-dot { flex: 1; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); }
      .gm-dot-done { background: var(--purple); }
      .gm-dot-now { background: var(--accent); }
      #panel .gm-progress-label { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }

      .gm-notice { border: 2px solid var(--damage); background: rgba(224, 48, 48, 0.2); border-radius: 12px; padding: 8px 12px; font-weight: 600; }
      .gm-card { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; padding: 4px 14px 8px; margin: 10px 0; }
      .gm-stats { display: flex; gap: 12px; margin: 10px 0; }
      .gm-stat { flex: 1; display: flex; flex-direction: column; padding: 8px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16); }
      .gm-stat-num { font-family: var(--serif); font-size: 2.6rem; line-height: 1.1; font-weight: 700; color: var(--accent); }
      .gm-stat-bad .gm-stat-num { color: var(--damage); }
      .gm-stat-label { font-size: 0.8rem; color: var(--muted); }
      .gm-stars { font-size: 2.6rem; letter-spacing: 4px; color: var(--accent); margin: 4px 0; }
      .gm-chart { max-width: 100%; height: auto; color: var(--text); }

      button {
        font: inherit;
        color: var(--text);
        cursor: pointer;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
        padding: 7px 16px;
      }
      button:hover:not(:disabled) { border-color: var(--text); background: rgba(255, 255, 255, 0.16); }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--bell); outline-offset: 3px; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .gm-views { display: flex; gap: 6px; margin: 14px 0 8px; }
      .gm-view-btn { flex: 1; font-size: 0.9rem; padding: 6px 8px; }
      .gm-view-btn.gm-active { background: var(--bell); border-color: var(--bell); color: #10202a; font-weight: 700; }

      .gm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .gm-secondary { background: transparent; border-color: rgba(255, 255, 255, 0.4); }
      .gm-primary {
        width: 100%;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 12px 18px;
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1426;
      }
      .gm-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
      .gm-next { animation: gm-pulse 1.6s ease-out infinite; }

      @keyframes gm-pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 148, 64, 0.85), 0 0 14px rgba(255, 122, 26, 0.6); }
        70% { box-shadow: 0 0 0 14px rgba(255, 148, 64, 0), 0 0 14px rgba(255, 122, 26, 0.6); }
        100% { box-shadow: 0 0 0 0 rgba(255, 148, 64, 0), 0 0 14px rgba(255, 122, 26, 0.6); }
      }
      @keyframes gm-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .gm-next, .gm-ghost { animation: none; }
        .gm-next { box-shadow: 0 0 0 4px rgba(255, 148, 64, 0.8); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="view"></div>
    <div id="panel"></div>
    <script type="module" src="/apps/ghost-mansion/main.ts"></script>
  </body>
</html>
